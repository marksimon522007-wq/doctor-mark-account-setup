<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <meta name="robots" content="noindex,nofollow,noarchive">
  <title>Doctor Mark Account Setup</title>
  <style>
    :root {
      color-scheme: light;
      --deep: #032b35;
      --deep2: #0b4a55;
      --gold: #9a741d;
      --ink: #162b32;
      --soft: #edf5f6;
      --danger: #8b1e2d;
      --success: #176b45;
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      min-height: 100vh;
      display: grid;
      place-items: center;
      padding: 18px;
      font-family: system-ui, "Segoe UI", sans-serif;
      background: linear-gradient(135deg, var(--deep), var(--deep2));
      color: var(--ink);
    }
    .card {
      width: min(94vw, 540px);
      padding: 30px;
      border-radius: 22px;
      background: #fff;
      box-shadow: 0 20px 70px #0007;
    }
    h1 {
      margin: 0 0 8px;
      font-size: clamp(28px, 7vw, 42px);
      line-height: 1.08;
    }
    .gold { color: var(--gold); }
    p { line-height: 1.5; }
    .message {
      margin: 16px 0;
      padding: 14px;
      border-radius: 12px;
      background: var(--soft);
      white-space: pre-wrap;
    }
    .message.error { background: #fff0f1; color: var(--danger); }
    .message.success { background: #ecf8f2; color: var(--success); }
    label { display: block; margin-top: 13px; font-weight: 700; }
    input, button {
      width: 100%;
      margin-top: 7px;
      padding: 14px;
      border-radius: 11px;
      font-size: 16px;
    }
    input { border: 1px solid #9aa; }
    button {
      border: 0;
      margin-top: 17px;
      background: var(--deep);
      color: #fff;
      font-weight: 800;
      cursor: pointer;
    }
    button:disabled { opacity: .65; cursor: wait; }
    .legal { margin-top: 20px; font-size: 12px; color: #566; }
  </style>
</head>
<body>
  <main class="card">
    <h1>Doctor Mark <span class="gold">Account Setup</span></h1>
    <p>Create a private password for your approved account.</p>

    <div id="message" class="message">Checking the secure email link…</div>

    <form id="form" hidden>
      <label for="password">New password</label>
      <input
        id="password"
        type="password"
        minlength="12"
        required
        autocomplete="new-password"
      >

      <label for="confirm">Confirm password</label>
      <input
        id="confirm"
        type="password"
        minlength="12"
        required
        autocomplete="new-password"
      >

      <button id="save" type="submit">Save password</button>
    </form>

    <p class="legal">
      This account is licensed for one approved physical device.
      The applications and educational content are not for redistribution.
    </p>
  </main>

  <script>
    "use strict";

    const PROJECT_URL =
      "https://jmheltndxoiyymglewxn.supabase.co";

    const PUBLISHABLE_KEY =
      "sb_publishable_VSZUKxCNe42zmka9OFJePA_9T8CiACv";

    const message = document.getElementById("message");
    const form = document.getElementById("form");
    const save = document.getElementById("save");

    function show(text, type = "") {
      message.textContent = text;
      message.className = "message" + (type ? " " + type : "");
    }

    function readLink() {
      const fragment = new URLSearchParams(
        location.hash.replace(/^#/, "")
      );
      const query = new URLSearchParams(location.search);

      return {
        accessToken:
          fragment.get("access_token") ||
          query.get("access_token"),

        type:
          fragment.get("type") ||
          query.get("type") ||
          "invite",

        error:
          fragment.get("error_code") ||
          query.get("error_code") ||
          fragment.get("error") ||
          query.get("error"),

        description:
          fragment.get("error_description") ||
          query.get("error_description") ||
          ""
      };
    }

    function initialise() {
      try {
        const link = readLink();

        if (link.error) {
          const expired =
            link.error === "otp_expired" ||
            /expired|already used/i.test(link.description);

          show(
            expired
              ? "This email link has expired or was already used. Request a fresh password email from the Doctor Mark app."
              : "This email link could not be verified: " +
                (link.description || link.error),
            "error"
          );

          form.hidden = true;
          return;
        }

        if (!link.accessToken) {
          show(
            "This email link is incomplete or has already been consumed. Request a fresh password email from the Doctor Mark app.",
            "error"
          );

          form.hidden = true;
          return;
        }

        window.doctorMarkAccessToken = link.accessToken;

        show(
          link.type === "recovery"
            ? "Choose your new Doctor Mark app password."
            : "Invitation verified. Choose your private Doctor Mark app password."
        );

        form.hidden = false;
      } catch (_) {
        show(
          "The secure link could not be read. Request a fresh password email.",
          "error"
        );
        form.hidden = true;
      }
    }

    form.addEventListener("submit", async (event) => {
      event.preventDefault();

      const password =
        document.getElementById("password").value;

      const confirm =
        document.getElementById("confirm").value;

      if (password.length < 12) {
        show("Use at least 12 characters.", "error");
        return;
      }

      if (password !== confirm) {
        show("The two passwords do not match.", "error");
        return;
      }

      const accessToken = window.doctorMarkAccessToken;

      if (!accessToken) {
        show(
          "The secure session is missing. Request a fresh password email.",
          "error"
        );
        form.hidden = true;
        return;
      }

      save.disabled = true;
      show("Saving your password…");

      try {
        const response = await fetch(
          PROJECT_URL + "/auth/v1/user",
          {
            method: "PUT",
            headers: {
              apikey: PUBLISHABLE_KEY,
              Authorization: "Bearer " + accessToken,
              "Content-Type": "application/json"
            },
            body: JSON.stringify({ password })
          }
        );

        let data = {};

        try {
          data = await response.json();
        } catch (_) {}

        if (!response.ok) {
          throw new Error(
            data.msg ||
            data.message ||
            data.error_description ||
            "Password update failed."
          );
        }

        window.doctorMarkAccessToken = null;
        form.hidden = true;

        history.replaceState(
          {},
          document.title,
          location.pathname
        );

        show(
          "Password saved successfully. Close this page and sign in to the Doctor Mark app using your email and the password you just created.",
          "success"
        );
      } catch (error) {
        save.disabled = false;

        show(
          "Could not save the password: " +
          (error && error.message
            ? error.message
            : "Unknown error"),
          "error"
        );
      }
    });

    window.addEventListener("hashchange", initialise);
    initialise();
  </script>
</body>
</html>
